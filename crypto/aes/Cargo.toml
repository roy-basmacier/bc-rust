[package]
name = "bouncycastle-aes"
version.workspace = true
edition.workspace = true

[features]
# Gates every AES key on the FIPS 140-3 self-test status in `bouncycastle-core`: until the
# self-test has passed, key creation returns `SymmetricCipherError::SelfTestNotPassed`. Off by
# default; `bouncycastle-fips` turns it on.
fips = ["bouncycastle-core/fips"]

[dependencies]
bouncycastle-core.workspace = true
bouncycastle-utils.workspace = true
bouncycastle-cipher.workspace = true

[dev-dependencies]
bouncycastle-cipher-test-framework.workspace = true
bouncycastle-core-test-framework.workspace = true
bouncycastle-hex.workspace = true
bouncycastle-rng.workspace = true
criterion.workspace = true

[[bench]]
name = "aes_benches"
harness = false

[[bench]]
name = "aes_modes_benches"
harness = false

[[bench]]
name = "aes_gcm_packet_benches"
harness = false
