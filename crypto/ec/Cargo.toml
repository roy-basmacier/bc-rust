[package]
name = "bouncycastle-ec"
links = "bouncycastle_ec"
version.workspace = true
edition.workspace = true

[features]
default = ["sm2"]
# SM2's curve arithmetic (`hazmat::sm2*`), which `bouncycastle-sm2` is built on. SP 800-186 does
# not list SM2, so a build of `bouncycastle-fips` with `approved-only` fails if this is on.
sm2 = []

[dependencies]
bouncycastle-utils.workspace = true

[dev-dependencies]
bouncycastle-hex.workspace = true
criterion.workspace = true

[[bench]]
name = "p256_field_benches"
harness = false

[[bench]]
name = "p256_point_benches"
harness = false

[[bench]]
name = "p384_field_benches"
harness = false

[[bench]]
name = "p384_point_benches"
harness = false

[[bench]]
name = "p521_field_benches"
harness = false

[[bench]]
name = "p521_point_benches"
harness = false

[[bench]]
name = "p256k1_field_benches"
harness = false

[[bench]]
name = "p256k1_point_benches"
harness = false

[[bench]]
name = "bp256r1_field_benches"
harness = false

[[bench]]
name = "bp256r1_point_benches"
harness = false

[[bench]]
name = "bp384r1_field_benches"
harness = false

[[bench]]
name = "bp384r1_point_benches"
harness = false

[[bench]]
name = "bp512r1_field_benches"
harness = false

[[bench]]
name = "bp512r1_point_benches"
harness = false

[[bench]]
name = "sm2_field_benches"
harness = false
required-features = ["sm2"]

[[bench]]
name = "sm2_point_benches"
harness = false
required-features = ["sm2"]

[[bench]]
name = "p256_scalar_benches"
harness = false

[[bench]]
name = "p384_scalar_benches"
harness = false

[[bench]]
name = "p521_scalar_benches"
harness = false

[[bench]]
name = "p256k1_scalar_benches"
harness = false

[[bench]]
name = "bp256r1_scalar_benches"
harness = false

[[bench]]
name = "bp384r1_scalar_benches"
harness = false

[[bench]]
name = "bp512r1_scalar_benches"
harness = false

[[bench]]
name = "sm2_scalar_benches"
harness = false
required-features = ["sm2"]

# The other tests are found automatically; these need the `sm2` feature.

[[test]]
name = "sm2_comb_tests"
required-features = ["sm2"]

[[test]]
name = "sm2_field_tests"
required-features = ["sm2"]

[[test]]
name = "sm2_point_tests"
required-features = ["sm2"]

[[test]]
name = "sm2_scalar_tests"
required-features = ["sm2"]

[[test]]
name = "sm2_sec1_tests"
required-features = ["sm2"]

[[test]]
name = "sm2_wnaf_tests"
required-features = ["sm2"]
