[package]
name = "bouncycastle-sha2"
version.workspace = true
edition.workspace = true

[features]
# Gates every SHA-2 instance on the FIPS 140-3 self-test status in `bouncycastle-core`: until the
# SHA-256 (or SHA-512) self-test has passed, creating a SHA-224 or SHA-256 (or SHA-384, SHA-512,
# SHA-512/t) instance panics, and so does every one-shot, HMAC and HKDF over it. Off by default;
# `bouncycastle-fips` turns it on.
fips = ["bouncycastle-core/fips"]

[dependencies]
bouncycastle-core.workspace = true
bouncycastle-hkdf.workspace = true
bouncycastle-hmac.workspace = true
bouncycastle-utils.workspace = true

[dev-dependencies]
criterion.workspace = true
bouncycastle-core-test-framework.workspace = true
bouncycastle-rng.workspace = true
bouncycastle-hex.workspace = true

[[bench]]
name = "sha2_benches"
harness = false

[[bench]]
name = "hkdf_sha2_benches"
harness = false

[[bench]]
name = "hmac_sha2_benches"
harness = false
