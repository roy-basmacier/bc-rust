[package]
name = "bouncycastle-sha2"
links = "bouncycastle_sha2"
version.workspace = true
edition.workspace = true

[features]
# The FIPS 140-3 self-tests (`self_test()`) and the gate that panics on creating a SHA-2 hash until
# the one covering it has passed. Off by default; turned on by `bouncycastle-fips`.
fips = ["bouncycastle-core/fips"]

[dependencies]
bouncycastle-core.workspace = true
bouncycastle-hkdf.workspace = true
bouncycastle-hmac.workspace = true
bouncycastle-utils.workspace = true

[dev-dependencies]
criterion.workspace = true
bouncycastle-core-test-framework.workspace = true
bouncycastle-rng.workspace = true
bouncycastle-hex.workspace = true

[[bench]]
name = "sha2_benches"
harness = false

[[bench]]
name = "hkdf_sha2_benches"
harness = false

[[bench]]
name = "hmac_sha2_benches"
harness = false
