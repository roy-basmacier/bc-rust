# Excluded from the root workspace (see `exclude` there) and its own workspace root, so that
# `cargo build --workspace` / `cargo test --workspace` never turn on the `fips` features this crate
# enables on the algorithm crates. Build and test it with
# `cargo test --manifest-path crypto/fips/Cargo.toml`; see "Feature unification" in src/lib.rs.
[package]
name = "bouncycastle-fips"
version = "0.1.4"
edition = "2024"
rust-version = "1.88"

[features]
default = ["aes", "sha2", "ecdsa", "eccdh"]
# Self-test AES (all modes and key sizes) and gate its services on the result.
aes = ["bouncycastle-aes/fips"]
# Self-test SHA-256 and SHA-512 (covering SHA-224, SHA-384, SHA-512/224 and SHA-512/256) and gate
# their services on the result; then self-test HMAC-SHA-512.
sha2 = ["bouncycastle-sha2/fips"]
# Self-test ECDSA (signature generation with a fixed and with a deterministic `k`, and
# verification; every curve) and gate its key pairs, signers and verifiers on the result; every
# generated key pair gets a pair-wise consistency test. The self-test hashes with SHA-256, so this
# implies `sha2`.
ecdsa = ["bouncycastle-ecdsa/fips", "sha2"]
# Self-test the ECC CDH primitive (every curve) and gate its key pairs and agreements on the
# result; every generated key pair gets a pair-wise consistency test.
eccdh = ["bouncycastle-eccdh/fips"]
# Run the software integrity test (the binary HMAC) at power-on, after HMAC-SHA-512's self-test.
# ELF targets only. Every program built with it fails power-on until the post-link tool has
# written its binary HMAC; see `binary_hmac`.
integrity = ["sha2"]
# A release build of a validated version: the module HMAC must equal the constant in
# src/expected_module_hmac.rs, or the build fails, and power-on checks it again.
fips-validated = ["sha2"]
# A FIPS-approved build: the build fails if any crate inside the module boundary has a cargo
# feature on that adds a non-approved service (today `bouncycastle-ec/sm2`), and the module offers
# its approved services as concrete types in `approved`. See APPROVED_MODE.md.
approved-only = []

# The module boundary: every crate of the module, which is the normal-dependency closure of aes,
# ascon, hmac, hkdf, sha3, ec, ecdsa and eccdh. Each one is a direct dependency, whether or not this
# crate uses it, because only a direct dependency's `links` metadata reaches build.rs, which
# hashes the sources of each. build.rs keeps the same list and fails the build if the two, or the
# closure, disagree.
[dependencies]
bouncycastle-aes = { path = "../aes" }
bouncycastle-ascon = { path = "../ascon" }
bouncycastle-cipher = { path = "../cipher" }
bouncycastle-concatkdf = { path = "../concatkdf" }
bouncycastle-core = { path = "../core", features = ["fips"] }
bouncycastle-ec = { path = "../ec", default-features = false }
bouncycastle-eccdh = { path = "../eccdh" }
bouncycastle-ecdsa = { path = "../ecdsa" }
bouncycastle-hkdf = { path = "../hkdf" }
bouncycastle-hmac = { path = "../hmac" }
bouncycastle-rng = { path = "../rng" }
bouncycastle-sha2 = { path = "../sha2" }
bouncycastle-sha3 = { path = "../sha3" }
bouncycastle-utils = { path = "../utils" }
bouncycastle-x963kdf = { path = "../x963kdf" }

# The build script's HMAC-SHA-512 comes through this crate, never a direct build-dependency on
# bouncycastle-sha2; see build-support/Cargo.toml for why.
[build-dependencies]
bouncycastle-fips-build = { path = "build-support" }

# The tests of the build script's logic; see tests/source_pin_tests.rs.
[dev-dependencies]
bouncycastle-fips-build = { path = "build-support" }

[[example]]
name = "crypto_officer"
required-features = ["aes", "sha2"]

[workspace]
# The post-link tool. Its test programs, `bc-fips-install/tests/consumer` and
# `bc-fips-install/tests/consumers`, are workspaces of their own.
# `build-support` is the build script's helper crate.
members = ["bc-fips-install", "build-support"]
# `cargo test --manifest-path crypto/fips/Cargo.toml` tests the build-time half too.
default-members = [".", "build-support"]

# The root manifest's `mutants` profile, which `.cargo/mutants.toml` names: profiles are read
# from the workspace root, and this crate is its own. Keep the two in step.
[profile.mutants]
inherits = "release"
lto = false
incremental = true
codegen-units = 16
