[package]
name = "bouncycastle-core"
links = "bouncycastle_core"
version.workspace = true
edition.workspace = true

[features]
# `std` gates the ergonomic, allocating (`Vec`-returning) one-shot APIs. It is on by
# default today; a future `--no-default-features` build is what will let `core` become
# `#![no_std]` (see the TODO at the top of `src/lib.rs`).
default = ["std"]
std = []
# `fips` adds the FIPS 140-3 self-test types and the module error state (`fips` module, the
# `SelfTestNotPassed` variants of `SymmetricCipherError`, `SignatureError`, `KeyAgreementError`
# and `SuspendableError`, and `KeyAgreementError::ConsistencyCheckFailed`) and nothing else; it is off by default and is turned on by the algorithm crates' own `fips` features.
fips = ["bouncycastle-utils/fips"]

[dependencies]
bouncycastle-utils.workspace = true

[dev-dependencies]
bouncycastle-rng.workspace = true
