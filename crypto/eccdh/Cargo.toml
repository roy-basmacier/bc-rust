[package]
name = "bouncycastle-eccdh"
links = "bouncycastle_eccdh"
version.workspace = true
edition.workspace = true

[features]
# The FIPS 140-3 self-test (`self_test()`), the gates that refuse key generation and agreement
# until it has passed, and the pair-wise consistency test on every generated key pair. Off by
# default; turned on by `bouncycastle-fips`.
fips = ["bouncycastle-core/fips"]

[dependencies]
bouncycastle-concatkdf.workspace = true
bouncycastle-core.workspace = true
bouncycastle-ec.workspace = true
bouncycastle-hkdf.workspace = true
bouncycastle-sha2.workspace = true
bouncycastle-utils.workspace = true
bouncycastle-x963kdf.workspace = true

[dev-dependencies]
bouncycastle-core-test-framework.workspace = true
bouncycastle-hex.workspace = true
bouncycastle-rng.workspace = true
criterion.workspace = true

[[bench]]
name = "eccdh_benches"
harness = false
